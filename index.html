<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a18">
<title>オールイン・ホールデム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one-screen app (online: each phone is one seat) — top bar, portrait stadium table with seats on an ellipse, hero panel pinned below. Single dark arcade look by choice. */
:root{
  --bg:#0f0a18; --panel:#1b1328; --panel2:#251a37; --line:#3a2b52;
  --felt:#15463e; --felt2:#0b2b26; --rail:#3b2414; --gold:#f0bf4c;
  --pink:#ff4f9a; --cyan:#3ee0ff; --fg:#f6f0ff; --mute:#ab9dc6;
  --red:#e0304a; --ink:#1d1630; --cardbg:#fffaf3; --green:#3be08a;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* ---------- setup ---------- */
#setup{height:100%;overflow-y:auto;padding-block:18px 40px;max-width:560px;margin:0 auto}
.logo{font-family:var(--display);font-weight:400;font-size:46px;line-height:.95;margin:6px 0 4px;letter-spacing:.01em;
  color:var(--fg);text-shadow:3px 3px 0 var(--pink),6px 6px 0 #5a1b3c;transform:skew(-8deg)}
.logo span{color:var(--gold);font-size:30px;text-shadow:3px 3px 0 #6b3d00}
.lede{color:var(--mute);margin:14px 0 18px;line-height:1.7;font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;margin-bottom:12px}
.box h2{margin:0;font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:800}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.stepper output{font-family:var(--display);font-size:30px;min-width:56px;text-align:center}
.prow{display:grid;grid-template-columns:22px 1fr auto 86px;gap:8px;align-items:center}
.prow .ix{font-family:var(--display);color:var(--mute);font-size:13px;text-align:center}
.prow input,.field input,.sheet input,.sheet select{min-width:0;width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:#120c1d;color:var(--fg);padding:0 10px;font:inherit;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 10px;height:36px;font-size:12px;font-weight:800;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{display:grid;gap:4px;font-size:11px;color:var(--mute);font-weight:700}
.big-btn{width:100%;height:56px;border:0;border-radius:14px;font-family:var(--display);font-size:20px;
  background:linear-gradient(100deg,var(--pink),#ff7a4f);color:#fff;box-shadow:0 5px 0 #8e1d50;letter-spacing:.04em}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8e1d50}
.hint{font-size:11.5px;color:var(--mute);line-height:1.6}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;padding-block:8px 4px}
.blinds{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#20175a,#2a1b4a);border:2px solid #fff;
  border-radius:4px;padding:5px 10px;transform:skew(-6deg);font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden}
.blinds small{font-family:var(--body);font-weight:800;color:var(--mute);font-size:11px}
.menu-btn{width:44px;height:36px;border-radius:6px;border:2px solid #fff;background:#111;font-family:var(--display);font-size:13px}

/* ---------- table ---------- */
.table{position:relative;flex:1;min-height:330px}
.felt{position:absolute;inset:8% 12%;border-radius:999px;
  background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2) 75%);
  box-shadow:0 0 0 9px var(--rail),0 0 0 11px #6b4426,0 18px 40px #000a,inset 0 0 40px #0008}
.felt::after{content:"ALL IN HOLD'EM";position:absolute;left:50%;top:70%;transform:translate(-50%,-50%) skew(-8deg);
  font-family:var(--display);font-size:13px;color:#ffffff14;white-space:nowrap;letter-spacing:.1em}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;width:72%}
.pot{font-family:var(--display);font-size:15px;color:var(--gold);text-shadow:2px 2px 0 #000;display:flex;gap:6px;align-items:baseline}
.pot small{font-family:var(--body);font-size:10px;color:#ffe8b0;font-weight:800}
.board{display:flex;gap:4px}
.street{font-family:var(--display);font-size:11px;color:#ffffffaa;transform:skew(-8deg);letter-spacing:.08em}

.seat{position:absolute;transform:translate(-50%,-50%);width:76px;display:grid;justify-items:center;gap:1px;z-index:2;transition:opacity .2s}
.av{position:relative;width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;
  font-family:var(--display);font-size:20px;color:#fff;text-shadow:1px 1px 0 #0006;border:2px solid #fff3;transform:rotate(-4deg)}
.seat.turn .av{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan),0 0 18px var(--cyan)}
.seat.win .av{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}
.seat.folded,.seat.out{opacity:.38}
.dbtn{position:absolute;right:-9px;top:-8px;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-size:11px;display:grid;place-items:center;
  font-family:var(--display);text-shadow:none;border:2px solid #111;transform:rotate(4deg)}
.cpu-badge{position:absolute;left:-7px;bottom:-6px;font-family:var(--body);font-size:8.5px;font-weight:800;background:#000c;color:var(--mute);padding:1px 4px;border-radius:4px;text-shadow:none}
.nm{font-size:10.5px;font-weight:800;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#000a;padding:1px 6px;border-radius:5px;margin-top:2px}
.ch{font-family:var(--display);font-size:12px;text-shadow:1px 1px 0 #000}
.tag{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:4px;background:#000b;color:#fff;transform:skew(-8deg);white-space:nowrap}
.tag.fold{color:#9a8fb0}.tag.allin{background:var(--pink);color:#fff}.tag.raise{background:#ff8a2b;color:#111}.tag.call{background:var(--green);color:#062}.tag.check{background:#2ab0d6;color:#022}
.tag.hand{background:var(--gold);color:#3a2300}
.minis{position:absolute;top:-6px;left:50%;transform:translateX(4px);display:flex;z-index:-1}
.minis .card{margin-left:-14px}
.betchip{position:absolute;transform:translate(-50%,-50%);z-index:1;font-family:var(--display);font-size:11px;display:flex;align-items:center;gap:3px;
  background:#000a;padding:1px 6px 1px 2px;border-radius:999px;white-space:nowrap}
.betchip::before{content:"";width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,var(--pink) 30% 62%,#fff 64% 70%,var(--pink) 72%)}

/* cards */
.card{width:38px;height:54px;border-radius:5px;background:var(--cardbg);color:var(--ink);display:grid;grid-template-rows:auto 1fr;padding:2px 4px;
  box-shadow:0 2px 4px #0007;font-weight:800;position:relative;flex:none}
.card b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1}
.card i{font-style:normal;font-size:22px;align-self:end;justify-self:end;line-height:1}
.card.red{color:var(--red)}
.card.slot{background:#ffffff0d;box-shadow:inset 0 0 0 1.5px #ffffff22}
.card.back{background:repeating-linear-gradient(45deg,#6b3fd6 0 5px,#5330b0 5px 10px);border:2px solid #fff}
.card.sm{width:26px;height:36px;padding:1px 3px;border-radius:4px}
.card.sm b{font-size:11px}.card.sm i{font-size:13px}
.card.lg{width:58px;height:82px;border-radius:7px;padding:4px 6px}
.card.lg b{font-size:24px}.card.lg i{font-size:34px}
.card.deal{animation:deal .35s ease-out both}
@keyframes deal{from{transform:translateY(-14px) rotate(-8deg);opacity:0}}
.card.hi{box-shadow:0 0 0 2px var(--gold),0 0 12px var(--gold)}

.result{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:5;background:#0a0612ee;border:2px solid var(--gold);border-radius:12px;
  padding:10px 12px;display:grid;gap:8px;justify-items:center;width:min(86%,320px);text-align:center}
.result .rt{font-family:var(--display);font-size:15px;color:var(--gold);line-height:1.35}
.result .rs{font-size:11.5px;color:var(--mute);line-height:1.5}
.result button{border:0;border-radius:10px;height:40px;padding:0 18px;font-family:var(--display);font-size:15px;background:var(--gold);color:#3a2300;box-shadow:0 4px 0 #8a6010}

/* ---------- hero panel ---------- */
.panel{background:linear-gradient(180deg,var(--panel),#120c1d);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:9px}
.hero{display:flex;gap:12px;align-items:center;min-height:82px}
.hcards{display:flex;gap:5px}
.hinfo{min-width:0;display:grid;gap:2px}
.hname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchips{font-family:var(--display);font-size:22px;color:var(--fg)}
.hhand{font-size:12px;font-weight:800;color:var(--gold)}
.wait{font-size:12.5px;color:var(--mute);font-weight:700;padding:6px 0;text-align:center}
.wait b{color:var(--cyan)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick button{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;font-weight:800}
.sl{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--pink)}
.sl input[type=number]{height:36px;border-radius:9px;border:1px solid var(--line);background:#120c1d;color:var(--fg);padding:0 8px;font:inherit;font-weight:800;min-width:0;width:100%}
.acts{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:7px}
.acts button{height:50px;border:0;border-radius:11px;font-family:var(--display);font-size:14px;line-height:1.15;color:#fff;transform:skew(-5deg)}
.acts small{display:block;font-family:var(--body);font-weight:800;font-size:11px;opacity:.9}
.b-fold{background:#4a3d60;box-shadow:0 4px 0 #2a2038}
.b-call{background:#1aa86a;box-shadow:0 4px 0 #0b5a36}
.b-raise{background:linear-gradient(100deg,var(--pink),#ff7a4f);box-shadow:0 4px 0 #8e1d50}
.b-raise.allin{background:linear-gradient(100deg,#a32bff,var(--pink))}
.acts button:active{transform:skew(-5deg) translateY(3px);box-shadow:none}
.acts button:disabled{opacity:.35}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#07040ce6;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.pass{text-align:center;display:grid;gap:14px;justify-items:center;max-width:320px}
.pass .who{font-family:var(--display);font-size:30px;transform:skew(-8deg);text-shadow:3px 3px 0 var(--pink)}
.pass p{margin:0;color:var(--mute);font-size:13px;line-height:1.7}
.pass button{height:52px;padding:0 28px;border:0;border-radius:14px;font-family:var(--display);font-size:18px;background:var(--cyan);color:#022;box-shadow:0 5px 0 #0a6c80}

.sheet{width:min(100%,420px);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.sheet .grp{display:grid;gap:8px}
.sheet label{font-size:11px;color:var(--mute);font-weight:800;letter-spacing:.06em}
.sheet .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.sheet .r3{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px}
.sbtn{height:38px;border-radius:9px;border:0;padding:0 14px;font-weight:800;background:var(--pink);color:#fff;white-space:nowrap}
.sbtn.ghost{background:var(--panel2);border:1px solid var(--line)}
.sbtn.danger{background:#5a1630}
.note{font-size:11.5px;color:var(--green);min-height:1em;font-weight:700}

/* ---------- cut-in ---------- */
.cut{position:fixed;inset:0;z-index:60;overflow:hidden;background:#0008;cursor:pointer}
.cut-flash{position:absolute;inset:0;background:#fff;animation:flash .35s ease-out forwards;pointer-events:none}
@keyframes flash{to{opacity:0}}
.cut-band{position:absolute;left:-10%;right:-10%;top:18%;height:64%;transform:skewY(-9deg);overflow:hidden;
  background:var(--cc);animation:band .32s cubic-bezier(.2,.9,.3,1.2) both;border-block:6px solid #fff}
.cut-band::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(90deg,#fff3 0 2px,transparent 2px 38px),repeating-linear-gradient(90deg,#0002 0 18px,transparent 18px 70px);
  animation:speed .35s linear infinite}
.cut-band::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 50%,transparent 30%,#0005 80%)}
@keyframes band{from{transform:skewY(-9deg) scaleY(0)}}
@keyframes speed{to{transform:translateX(-76px)}}
.cut-girl{position:absolute;right:-4%;bottom:6%;width:min(78vw,400px);animation:girl .5s .08s cubic-bezier(.15,.9,.25,1.25) both;filter:drop-shadow(8px 8px 0 #0007)}
@keyframes girl{from{transform:translateX(110%) rotate(8deg)}}
.cut-girl svg{width:100%;height:auto;display:block}
.cut-txt{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12%;display:grid;gap:4px;z-index:2;animation:slam .42s .18s cubic-bezier(.2,.9,.3,1.3) both;transform-origin:left center}
@keyframes slam{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.cut-big{font-family:var(--display);font-size:clamp(52px,16vw,96px);line-height:.9;color:#fff;transform:skew(-10deg);
  -webkit-text-stroke:3px #1a0a20;paint-order:stroke fill;text-shadow:6px 6px 0 var(--cc2)}
.cut-who{font-family:var(--display);font-size:22px;background:#111;color:#fff;padding:4px 12px;transform:skew(-10deg);justify-self:start;border-left:6px solid var(--cc2)}
.cut-amt{font-family:var(--display);font-size:20px;color:var(--gold);transform:skew(-10deg);text-shadow:2px 2px 0 #000}
.cut-line{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10%;z-index:2;background:#fff;color:#1a0a20;font-weight:800;font-size:16px;
  padding:10px 16px;border-radius:18px 18px 18px 4px;max-width:58vw;animation:pop .3s .45s ease-out both;box-shadow:4px 4px 0 #0006}
.cut-line small{display:block;font-size:10.5px;color:#8a6a9a}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.cut-skip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));font-size:11px;color:#fffb;font-weight:800;z-index:3}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:700px){.card.lg{width:48px;height:68px}.card.lg b{font-size:19px}.card.lg i{font-size:27px}.hero{min-height:68px}.acts button{height:44px}}
/* ---------- online additions ---------- */
.msg{height:100%;display:grid;place-items:center;text-align:center;padding-block:24px}
.msg p{color:var(--mute);line-height:1.8;font-size:13.5px;max-width:34ch;margin:10px auto 18px}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left;width:100%}
.trow .tc{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--gold)}
.trow .ti{min-width:0;font-size:12px;color:var(--mute);line-height:1.5}
.trow .ti b{color:var(--fg);font-size:13px}
.pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#2ab0d633;color:var(--cyan);white-space:nowrap}
.pill.play{background:#ff4f9a33;color:var(--pink)}
.join-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.join-row input{min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:#120c1d;color:var(--fg);padding:0 12px;font:inherit;font-size:15px}
.join-row .code-in{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display)}
.mid-btn{height:44px;border:0;border-radius:10px;padding:0 16px;font-family:var(--display);font-size:14px;background:var(--cyan);color:#022;white-space:nowrap}
.mid-btn.pink{background:var(--pink);color:#fff}
.mid-btn:disabled{opacity:.4}
.codebig{font-family:var(--display);font-size:52px;letter-spacing:.14em;color:var(--gold);text-shadow:3px 3px 0 #6b3d00;line-height:1;transform:skew(-8deg)}
.lseat{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lseat:last-child{border-bottom:0}
.lav{width:34px;height:34px;border-radius:9px;background:var(--c);display:grid;place-items:center;font-family:var(--display);color:#fff;font-size:15px}
.lseat .ln{min-width:0;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lseat .ln small{display:block;font-size:10.5px;color:var(--mute);font-weight:700}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:8px;height:30px;padding:0 10px;font-size:11px;font-weight:800;color:var(--mute)}
.timer{font-size:11px;font-weight:800;color:var(--cyan);text-align:center}
.timer.low{color:var(--pink)}
.err{color:#ff8aa6;font-size:12px;font-weight:700}
.top .code{font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.08em}
.you{font-size:9px;font-weight:800;color:#022;background:var(--cyan);padding:0 5px;border-radius:4px;margin-left:3px}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="root" class="app"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>Math.round(n||0).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ===== cards & evaluation ===== */
const SUITS=['s','h','d','c'],SCH={s:'♠',h:'♥',d:'♦',c:'♣'};
const rch=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||String(r));
const FULL=[];for(const s of SUITS)for(let r=2;r<=14;r++)FULL.push({r,s});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const newDeck=()=>shuffle(FULL.map(c=>({...c})));
const HN=['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'];
const P5=15**5;
function eval5(c){
  const rs=c.map(x=>x.r).sort((a,b)=>b-a),fl=c.every(x=>x.s===c[0].s),cnt={};
  for(const r of rs)cnt[r]=(cnt[r]||0)+1;
  const g=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const u=[...new Set(rs)];let st=0;

const COMB={};
function combos(n){if(COMB[n])return COMB[n];const out=[];const rec=(st,cur)=>{if(cur.length===5){out.push(cur.slice());return;}for(let i=st;i<n;i++){cur.push(i);rec(i+1,cur);cur.pop();}};rec(0,[]);return COMB[n]=out;}
let bestIdx=null;
function best(cards){if(cards.length<5)return -1;let b=-1,bi=null;for(const cb of combos(cards.length)){const v=eval5(cb.map(i=>cards[i]));if(v>b){b=v;bi=cb;}}bestIdx=bi;return b;}

function equity(hole,board,nOpp,iters){
  const key=c=>c.r+c.s,used=new Set([...hole,...board].map(key)),rest=FULL.filter(c=>!used.has(key(c)));
  const need=5-board.length;let win=0;
  for(let it=0;it<iters;it++){
    const d=rest.slice(),m=need+2*nOpp;
    for(let i=0;i<m;i++){const j=i+(Math.random()*(d.length-i)|0);[d[i],d[j]]=[d[j],d[i]];}
    const b=board.concat(d.slice(0,need)),my=best(hole.concat(b));let top=0,ties=0;
    for(let o=0;o<nOpp;o++){const v=best([d[need+2*o],d[need+2*o+1]].concat(b));if(v>top){top=v;ties=0;}else if(v===top)ties++;}
    if(my>top)win+=1;else if(my===top)win+=1/(ties+2);
  }
  return win/iters;
}

    conn.on('close',()=>onHostClose(conn));conn.on('error',()=>onHostClose(conn));

function sendJoin(leave){
  if(isHost){hq(()=>handleJoin(ME.uid,{name:myName(),leave}));return;}
  if(hostConn&&hostConn.open){try{hostConn.send(JSON.stringify({t:leave?'leave':'join',cid:ME.uid,name:myName()}));}catch(e){}}
  if(leave)setTimeout(()=>{setHash('');showHome('');},300);
}
function sendAct(a){
  const i=mySeat();if(i<0)return;
  if(isHost){sentTurn=S.turnId;render();const tid=S.turnId;hq(()=>hostApply(i,a,tid));return;}
  if(!hostConn||!hostConn.open){lastErr='ホストとつながっていません。つながるまで待ってください。';render();return;}
  sentTurn=S.turnId;render();
  try{hostConn.send(JSON.stringify({t:'act',cid:ME.uid,turnId:S.turnId,type:a.type,to:a.to||0}));}catch(e){sentTurn=-1;render();}
}

function hostRemove(i){hq(async()=>{if(S.status!=='lobby'||S.seats[i].uid===S.hostUid)return;const s=S.seats.splice(i,1)[0];await commit();
  if(s.uid){sendTo(s.uid,{t:'full'});}});}
function hostSettings(o){hq(async()=>{Object.assign(S,o);if(S.status==='lobby'&&'start' in o)S.seats.forEach(s=>s.chips=S.start);await commit();});}
function hostStart(){hq(async()=>{if(S.seats.length<2)return;S.status='hand';S.dealer=-1;S.handNo=0;S.seats.forEach(s=>{s.out=false;s.waiting=false;});await startHand();await advance();});}

/* engine (host only) */
const inHand=p=>!p.out&&!p.folded;
const canAct=p=>inHand(p)&&!p.allIn;
const needs=q=>canAct(q)&&(!q.acted||q.bet<S.currentBet);
function nextIdx(i,pred){const n=S.seats.length;for(let k=1;k<=n;k++){const j=((i+k)%n+n)%n;if(pred(S.seats[j]))return j;}return -1;}
const potTotal=()=>S.seats.reduce((s,p)=>s+(p.total||0),0);
function pay(p,a){a=Math.max(0,Math.min(a,p.chips));p.chips-=a;p.bet+=a;p.total+=a;if(p.chips===0)p.allIn=true;return a;}
function newEv(kind,seat,amt){S.evN=(S.evN||0)+1;S.ev={id:S.handNo+'-'+S.evN,kind,seat,amt,name:S.seats[seat].name,g:(seat+S.handNo)%GIRLS.length,l:Math.random()*3|0};}
async function startHand(){
  clearTimeout(nextTimer);
  S.seats.forEach(p=>{p.chips+=p.pending||0;p.pending=0;});
  if(S.seats.filter(p=>p.chips>0).length<2){S.status='over';const w=S.seats.slice().sort((a,b)=>b.chips-a.chips)[0];newEv('win',S.seats.indexOf(w),w.chips);await commit();return;}
  S.handNo++;S.board=[];S.street=0;S.showdown=false;S.result=null;S.hadAllIn=false;S.status='hand';
  S.seats.forEach(p=>Object.assign(p,{waiting:false,out:p.chips<=0,bet:0,total:0,folded:false,allIn:false,acted:false,tag:'',tagc:'',handName:'',won:0,dealt:false,cards:[],enc:null}));
  const n=S.seats.length,alive=S.seats.filter(p=>!p.out);
  S.dealer=nextIdx(S.dealer,p=>!p.out);
  if(alive.length===2){S.sb=S.dealer;S.bb=nextIdx(S.dealer,p=>!p.out);}else{S.sb=nextIdx(S.dealer,p=>!p.out);S.bb=nextIdx(S.sb,p=>!p.out);}
  const sp=S.seats[S.sb],bp=S.seats[S.bb];pay(sp,S.SB);sp.tag='SB';pay(bp,S.BB);bp.tag='BB';
  const deck=newDeck();H={handNo:S.handNo,hole:{},deck:null};
  for(let i=0;i<n;i++)if(!S.seats[i].out){H.hole[i]=[deck.pop(),deck.pop()];S.seats[i].dealt=true;}
  H.deck=deck;
  for(let i=0;i<n;i++)await sealSeat(i);
  S.currentBet=S.BB;S.minRaise=S.BB;S.toAct=-1;S.nextTo=nextIdx(S.bb,canAct);
  await saveSecret();
}
async function refundHand(){ // host lost its secret: return the bets and redeal
  S.seats.forEach(p=>{p.chips+=p.total||0;p.total=0;p.bet=0;});S.dealer=Math.max(-1,S.dealer-1);await startHand();await advance();}
function roundDone(){
  const a=S.seats.filter(canAct);
  if(a.length===0)return true;
  if(a.length===1&&a[0].bet>=S.currentBet)return true;
  return a.every(p=>p.acted&&p.bet===S.currentBet);
}
function reveal(){S.showdown=true;S.seats.forEach((p,i)=>{if(inHand(p)&&H.hole[i])p.cards=H.hole[i];});}
async function advance(){
  if(!S||S.status!=='hand')return;
  clearTimeout(turnTimer);
  if(S.seats.filter(inHand).length===1){awardFold();await commit();scheduleNext();return;}
  if(roundDone()){
    S.seats.forEach(p=>{p.bet=0;p.acted=false;if(canAct(p))p.tag='';});S.currentBet=0;S.minRaise=S.BB;
    if(S.street===3){showdown();await commit();scheduleNext();return;}
    let delay=600;
    if(S.seats.filter(canAct).length<=1&&!S.showdown){reveal();await commit();await sleep(900);delay=1300;}
    S.street++;
    if(S.street===1)S.board.push(...H.deck.splice(0,3));else S.board.push(H.deck.pop());
    S.toAct=-1;S.nextTo=-1;S.deadline=0;await commit();await saveSecret();
    setTimeout(()=>hq(advance),delay);
    return;
  }
  let i=S.toAct>=0?S.toAct:(S.nextTo>=0?S.nextTo:-1);if(i<0||!needs(S.seats[i]))i=nextIdx(i<0?S.dealer:i,needs);
  S.toAct=i;S.nextTo=-1;S.turnId++;S.deadline=S.turnSec&&!S.seats[i].cpu?Date.now()+S.turnSec*1000:0;
  await commit();
  const p=S.seats[i];
  if(p.cpu)scheduleCpu(i,S.turnId);
  else if(S.deadline){const tid=S.turnId;turnTimer=setTimeout(()=>hq(()=>{if(S.turnId!==tid)return;const q=S.seats[i];
    return hostApply(i,{type:S.currentBet-q.bet===0?'check':'fold'},tid);}),S.turnSec*1000+800);}
}
function scheduleCpu(i,tid){setTimeout(()=>hq(()=>{if(!S||S.status!=='hand'||S.turnId!==tid||S.toAct!==i)return;return hostApply(i,cpuDecide(i),tid);}),speed);}
async function hostApply(i,a,tid){
  if(!S||S.status!=='hand'||tid!==S.turnId||S.toAct!==i)return;
  const p=S.seats[i];if(!canAct(p))return;
  clearTimeout(turnTimer);S.turnId++;
  const toCall=S.currentBet-p.bet;
  if(a.type==='fold'){p.folded=true;p.tag='フォールド';p.tagc='fold';}
  else if(a.type==='check'&&toCall===0){p.tag='チェック';p.tagc='check';}
  else if(a.type==='call'||(a.type==='check'&&toCall>0)){pay(p,toCall);p.tag='コール';p.tagc='call';}
  else{
    const maxTo=p.bet+p.chips;let to=Math.min(Math.round(+a.to||0),maxTo);
    const minTo=Math.min(maxTo,S.currentBet===0?S.BB:S.currentBet+S.minRaise);
    if(to<minTo)to=minTo;
    if(to<=S.currentBet){pay(p,toCall);p.tag='コール';p.tagc='call';}
    else{const was0=S.currentBet===0,by=to-S.currentBet;pay(p,to-p.bet);
      if(by>=S.minRaise)S.minRaise=by;S.currentBet=to;S.seats.forEach(q=>{if(q!==p)q.acted=false;});
      p.tag=(was0?'ベット ':'レイズ ')+fmt(to);p.tagc='raise';}
  }
  p.acted=true;
  let wait=250;
  if(p.allIn&&a.type!=='fold'){p.tag='オールイン';p.tagc='allin';S.hadAllIn=true;newEv('allin',i,p.total);wait=2400;}
  S.nextTo=nextIdx(i,needs);S.toAct=-1;S.deadline=0;
  await commit();
  setTimeout(()=>hq(advance),wait);
}
function awardFold(){const w=S.seats.find(inHand),pot=potTotal(),wi=S.seats.indexOf(w);w.chips+=pot;w.won=pot;S.seats.forEach(p=>p.bet=0);
  S.result={type:'fold',winners:[wi],pot};S.status='result';S.toAct=-1;S.nextAt=Date.now()+9000;if(S.hadAllIn||pot>=S.BB*30)newEv('win',wi,pot);}
function showdown(){
  reveal();
  const live=S.seats.filter(inHand);
  live.forEach(p=>{const i=S.seats.indexOf(p);p.score=best(H.hole[i].concat(S.board));p.handName=HN[catOf(p.score)];p.tag='';});
  const levels=[...new Set(S.seats.filter(p=>p.total>0).map(p=>p.total))].sort((a,b)=>a-b);
  const order=[];for(let k=1;k<=S.seats.length;k++)order.push(S.seats[(S.dealer+k)%S.seats.length]);
  let prev=0,carry=0,pots=0,last=null;
  for(const L of levels){let amt=carry;S.seats.forEach(p=>{amt+=Math.max(0,Math.min(p.total,L)-prev);});prev=L;
    const el=live.filter(p=>p.total>=L);if(!el.length){carry=amt;continue;}carry=0;
    const top=Math.max(...el.map(p=>p.score)),ws=order.filter(p=>el.includes(p)&&p.score===top);
    const sh=Math.floor(amt/ws.length);ws.forEach(p=>p.won+=sh);ws[0].won+=amt-sh*ws.length;pots++;last=ws;}
  if(carry&&last)last[0].won+=carry;
  S.seats.forEach(p=>{p.chips+=p.won;p.bet=0;delete p.score;});
  const winners=S.seats.map((p,i)=>p.won>0?i:-1).filter(i=>i>=0);
  S.result={type:'show',winners,pot:potTotal(),pots};S.status='result';S.toAct=-1;S.nextAt=Date.now()+9000;
  const top=winners.slice().sort((a,b)=>S.seats[b].won-S.seats[a].won)[0];
  if(top!=null&&(S.hadAllIn||S.result.pot>=S.BB*30))newEv('win',top,S.seats[top].won);
}
function scheduleNext(){clearTimeout(nextTimer);nextTimer=setTimeout(()=>hq(hostNext),Math.max(1500,(S.nextAt||0)-Date.now()));}
async function hostNext(){if(!S||S.status!=='result')return;clearTimeout(nextTimer);await startHand();if(S.status==='hand')await advance();}
function cpuDecide(i){
  const p=S.seats[i],hole=H.hole[i];
  const opp=S.seats.filter(q=>inHand(q)&&q!==p).length;
  const eq=equity(hole,S.board,Math.max(1,Math.min(opp,4)),130),adv=eq*(Math.min(opp,4)+1);
  const toCall=S.currentBet-p.bet,pot=potTotal(),odds=toCall>0?toCall/(pot+toCall):0,r=Math.random(),maxTo=p.bet+p.chips;
  const rt=f=>{let t=S.currentBet+Math.max(S.minRaise,Math.round((pot+toCall)*f/S.SB)*S.SB);if(t>=maxTo*.65)t=maxTo;return Math.min(t,maxTo);};
  const cr=maxTo>S.currentBet;
  if(cr&&adv>2.2&&r<.35)return{type:'raise',to:maxTo};
  if(cr&&(adv>1.7||(adv>1.3&&r<.45)))return{type:'raise',to:rt(.5+Math.random()*.6)};
  if(toCall===0){if(cr&&r<.13)return{type:'raise',to:rt(.4+Math.random()*.3)};return{type:'check'};}
  if(eq>odds*1.15||(toCall<=S.BB&&adv>.75)||r<.04)return{type:'call'};
  return{type:'fold'};
}

/* ===== cut-in ===== */
function queueCut(ev){cutQ.push(ev);if(!cutBusy)runCuts();}
async function runCuts(){cutBusy=true;while(cutQ.length){const ev=cutQ.shift();if(cutQ.length>2)continue;await cutin(ev);}cutBusy=false;}
function cutin(ev){
  return new Promise(res=>{
    const g=GIRLS[ev.g||0],lines=ev.kind==='win'?g.win:g.allin,line=lines[(ev.l||0)%lines.length];
    const el=document.createElement('div');el.className='cut';el.setAttribute('role','dialog');el.setAttribute('aria-label',ev.kind==='win'?'勝利演出':'オールイン演出');
    el.style.setProperty('--cc',ev.kind==='win'?'#f0bf4c':g.cc);el.style.setProperty('--cc2',g.cc2);
    el.innerHTML=`<div class="cut-band"></div><div class="cut-girl">${girlSVG(g)}</div>
      <div class="cut-txt"><div class="cut-big">${ev.kind==='win'?'WIN!!':'ALL IN!!'}</div><div class="cut-who">${esc(ev.name)}</div>
      <div class="cut-amt num">${ev.kind==='win'?'+'+fmt(ev.amt):'合計 '+fmt(ev.amt)}</div></div>
      <div class="cut-line">「${esc(line)}」<small>${g.name}</small></div><div class="cut-skip">タップでスキップ</div><div class="cut-flash"></div>`;
    document.body.appendChild(el);let done=false;const close=()=>{if(done)return;done=true;el.remove();res();};
    el.onclick=close;setTimeout(close,ev.kind==='win'?2400:2100);
  });
}

/* ===== render ===== */
function cardHTML(c,cls=''){if(!c)return `<div class="card slot ${cls}"></div>`;return `<div class="card ${c.s==='h'||c.s==='d'?'red':''} ${cls}"><b>${rch(c.r)}</b><i>${SCH[c.s]}</i></div>`;}
const backHTML=cls=>`<div class="card back ${cls}"></div>`;
function render(){
  if(!S)return;
  if(typing()){pendingRender=true;return;}
  if(S.status==='lobby')return renderLobby();
  if(S.status==='closed'){renderMsg('このテーブルは閉じられました','トップから新しいテーブルを作るか、別のテーブルに参加してください。','トップに戻る');return;}
  if(S.status==='over')return renderOver();
  renderTable();
}
function topBar(){return `<div class="top"><div class="blinds num"><span class="code">${esc(S.code)}</span> SB/BB ${fmt(S.SB)}/${fmt(S.BB)} <small>#${S.handNo}</small></div><button class="menu-btn" id="menu" aria-label="メニュー">≡</button></div>`;}
function renderTable(){
  const n=S.seats.length,mi=mySeat(),base=mi>=0?mi:0;
  const stName=['プリフロップ','フロップ','ターン','リバー'][S.street]||'';
  const winSet=new Set(S.result?S.result.winners:[]);
  const hiKeys=new Set();
  if(S.result&&S.result.type==='show'&&S.result.winners.length){const w=S.seats[S.result.winners[0]];if(w.cards&&w.cards.length){const all=w.cards.concat(S.board);best(all);if(bestIdx)bestIdx.forEach(k=>hiKeys.add(all[k].r+all[k].s));}}
  const hk=c=>c&&hiKeys.has(c.r+c.s)?'hi':'';
  let seats='';
  S.seats.forEach((p,i)=>{
    const rel=(i-base+n)%n,ang=(90+rel*360/n)*Math.PI/180;
    const x=50+40*Math.cos(ang),y=50+42*Math.sin(ang),bx=50+25*Math.cos(ang),by=50+27*Math.sin(ang);
    const face=p.cards&&p.cards.length?p.cards:(i===mi&&myCards?myCards:null);
    const minis=p.out||p.folded||!p.dealt?'':`<div class="minis">${face?face.map(c=>cardHTML(c,'sm '+hk(c))).join(''):backHTML('sm')+backHTML('sm')}</div>`;
    let tag='';
    if(p.waiting)tag='<span class="tag fold">次から参加</span>';
    else if(p.away&&!p.cpu)tag='<span class="tag fold">通信待ち</span>';
    else if(p.out)tag='<span class="tag fold">OUT</span>';
    else if(S.result&&p.won)tag=`<span class="tag hand">+${fmt(p.won)}</span>`;
    else if(S.showdown&&p.handName)tag=`<span class="tag hand">${p.handName}</span>`;
    else if(p.tag)tag=`<span class="tag ${p.tagc||''}">${esc(p.tag)}</span>`;
    const turn=S.status==='hand'&&i===S.toAct;
    seats+=`<div class="seat ${turn?'turn':''} ${p.folded?'folded':''} ${p.out?'out':''} ${winSet.has(i)?'win':''}" style="left:${x}%;top:${y}%">
      <div class="av" style="--c:${p.color}">${esc([...p.name][0]||'?')}${i===S.dealer?'<span class="dbtn">D</span>':''}${p.cpu?'<span class="cpu-badge">CPU</span>':''}${minis}</div>
      <div class="nm">${esc(p.name)}</div><div class="ch num">${fmt(p.chips)}</div>${tag}</div>`;
    if(p.bet>0)seats+=`<div class="betchip num" style="left:${bx}%;top:${by}%">${fmt(p.bet)}</div>`;
  });
  const total=potTotal(),collected=total-S.seats.reduce((s,p)=>s+(p.bet||0),0);
  const board=[0,1,2,3,4].map(i=>cardHTML(S.board[i],hk(S.board[i]))).join('');
  let result='';
  if(S.status==='result'&&S.result){
    const ws=S.result.winners.map(i=>`${esc(S.seats[i].name)} +${fmt(S.seats[i].won)}`).join('、');
    const hn=S.result.type==='show'?`（${[...new Set(S.result.winners.map(i=>S.seats[i].handName))].join('／')}）`:'（ほかの全員がフォールド）';
    const side=S.result.pots>1?`<div class="rs">メイン＋サイドポット ${S.result.pots-1}個に分けて精算しました</div>`:'';
    result=`<div class="result"><div class="rt">${ws}</div><div class="rs">${hn}</div>${side}
      ${isHost?'<button id="nexth">次のハンドへ</button>':''}<div class="rs" id="nextin"></div></div>`;
  }
  let panel='';
  const me=mi>=0?S.seats[mi]:null;
  if(me&&me.dealt){
    let hand='';if(myCards&&S.board.length>=3&&!me.folded)hand=HN[catOf(best(myCards.concat(S.board)))];
    panel+=`<div class="hero"><div class="hcards">${myCards?myCards.map(c=>cardHTML(c,'lg '+hk(c))).join(''):backHTML('lg')+backHTML('lg')}</div>
      <div class="hinfo"><div class="hname">${esc(me.name)}${me.folded?'（フォールド）':''}</div><div class="hchips num">${fmt(me.chips)}</div><div class="hhand">${myCards?hand:'カードを受け取り中…'}</div></div></div>`;
  }else if(me){
    panel+=`<div class="hero"><div class="hinfo"><div class="hname">${esc(me.name)}</div><div class="hchips num">${fmt(me.chips)}</div><div class="hhand" style="color:var(--mute)">${me.waiting?'次のハンドから参加します':(me.out?'チップがありません。ホストに追加してもらえます':'')}</div></div></div>`;
  }else{
    panel+=`<div class="wait">観戦中です。${readonly()?'':'参加するとロビー以外では次のハンドから座れます。'}</div>`+
      (readonly()||S.seats.length>=9?'':`<div class="join-row"><input id="jn" maxlength="10" value="${esc(ME.name)}" placeholder="名前"><button class="mid-btn pink" id="tjoin">参加する</button></div>`);
  }
  const myTurn=S.status==='hand'&&me&&mi===S.toAct&&!me.cpu&&canAct(me);
  if(myTurn&&sentTurn!==S.turnId){
    const toCall=S.currentBet-me.bet,maxTo=me.bet+me.chips,cr=maxTo>S.currentBet&&S.seats.some((q,j)=>j!==mi&&canAct(q));
    const minTo=Math.min(maxTo,S.currentBet===0?S.BB:S.currentBet+S.minRaise);
    if(raiseTo<minTo||raiseTo>maxTo||raiseTo===0)raiseTo=minTo;
    const isAll=raiseTo>=maxTo,callLbl=toCall===0?'チェック':(toCall>=me.chips?'オールイン':'コール');
    panel+=`<div class="timer" id="timer"></div>`+(cr?`<div class="quick"><button data-q="min">最小</button><button data-q="half">½ポット</button><button data-q="pot">ポット</button><button data-q="all">オールイン</button></div>
      <div class="sl"><input id="rs" type="range" min="${minTo}" max="${maxTo}" step="1" value="${raiseTo}" aria-label="賭ける額">
      <input id="rn" type="number" inputmode="numeric" min="${minTo}" max="${maxTo}" value="${raiseTo}" aria-label="賭ける額（数値）"></div>`:'')+
      `<div class="acts"><button class="b-fold" id="af">フォールド</button>
      <button class="b-call" id="ac">${callLbl}${toCall>0?`<small class="num">${fmt(Math.min(toCall,me.chips))}</small>`:''}</button>
      <button class="b-raise ${isAll?'allin':''}" id="ar" ${cr?'':'disabled'}>${isAll?'オールイン':(S.currentBet===0?'ベット':'レイズ')}<small class="num">${cr?fmt(raiseTo):'—'}</small></button></div>`;
  }else if(S.status==='hand'){
    const cur=S.seats[S.toAct];
    panel+=`<div class="wait">${myTurn?'送信しました…':(cur?`<b>${esc(cur.name)}</b> が考え中… <span id="timer"></span>`:'…')}</div>`;
  }
  $('#root').innerHTML=`${topBar()}
    <div class="table"><div class="felt"></div>
      <div class="center"><div class="pot num">ポット ${fmt(collected)}${total!==collected?`<small>（合計 ${fmt(total)}）</small>`:''}</div>
      <div class="board">${board}</div><div class="street">${S.status==='result'?'SHOWDOWN':stName}</div></div>
      ${seats}${result}</div>
    <div class="panel">${panel}<div class="err" id="errline">${esc(lastErr)}</div></div>`;
  $('#menu').onclick=openMenu;
  const nh=$('#nexth');if(nh)nh.onclick=()=>hq(hostNext);
  const tj=$('#tjoin');if(tj)tj.onclick=()=>{const v=$('#jn').value.trim();if(!v)return;ME.name=v;ls.set('aih_name',v);tj.disabled=true;sendJoin(false);};
  tickTimer();
  if(!myTurn||sentTurn===S.turnId)return;
  const maxTo=me.bet+me.chips;
  const set=v=>{const rs=$('#rs');if(!rs)return;v=Math.round(Math.max(+rs.min,Math.min(maxTo,v)));raiseTo=v;rs.value=v;$('#rn').value=v;
    const ar=$('#ar'),all=v>=maxTo;ar.classList.toggle('allin',all);ar.innerHTML=`${all?'オールイン':(S.currentBet===0?'ベット':'レイズ')}<small class="num">${fmt(v)}</small>`;};
  const rs=$('#rs');
  if(rs){rs.oninput=()=>set(+rs.value);$('#rn').onchange=e=>set(parseInt(e.target.value)||+rs.min);
    document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const toCall=S.currentBet-me.bet,q=b.dataset.q;
      set(q==='min'?+rs.min:q==='all'?maxTo:S.currentBet+(total+toCall)*(q==='half'?.5:1));});}
  $('#af').onclick=()=>sendAct({type:'fold'});
  $('#ac').onclick=()=>sendAct({type:S.currentBet-me.bet===0?'check':'call'});
  const ar=$('#ar');if(ar)ar.onclick=()=>{const a={type:'raise',to:raiseTo};raiseTo=0;sendAct(a);};
}
function tickTimer(){
  if(!S)return;
  const el=$('#timer');
  if(el){if(S.status==='hand'&&S.deadline){const s=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));el.textContent=`残り ${s} 秒`;el.classList.toggle('low',s<=10);}else el.textContent='';}
  const ni=$('#nextin');if(ni&&S.status==='result'&&S.nextAt){const s=Math.max(0,Math.ceil((S.nextAt-Date.now())/1000));ni.textContent=`${s}秒後に次のハンドが始まります`;}
}
function renderOver(){
  const rank=S.seats.slice().sort((a,b)=>b.chips-a.chips);
  const w=rank[0];
  $('#root').innerHTML=`<section id="setup"><h1 class="logo">CHAMPION<br><span>${esc(w.name)}</span></h1>
    <p class="lede">${S.handNo}ハンドの勝負でした。</p>
    <div class="box"><h2>最終結果</h2>${rank.map((p,i)=>`<div class="lseat" style="grid-template-columns:22px 1fr auto"><span class="ix" style="font-family:var(--display);color:var(--mute)">${i+1}</span><span class="ln">${esc(p.name)}</span><span class="num" style="font-family:var(--display)">${fmt(p.chips)}</span></div>`).join('')}</div>
    ${isHost?'<button class="big-btn" id="again">ロビーに戻ってもう一度</button>':'<p class="hint">ホストが次のゲームを始めるとロビーに戻ります。</p>'}
    <button class="mid-btn" id="home" style="width:100%;margin-top:10px;background:var(--panel2);color:var(--fg);border:1px solid var(--line)">トップに戻る</button></section>`;
  const a=$('#again');if(a)a.onclick=()=>hostToLobby();
  $('#home').onclick=()=>{setHash('');showHome('');};
}
function hostToLobby(){hq(async()=>{clearTimeout(turnTimer);clearTimeout(nextTimer);S.status='lobby';S.handNo=0;S.dealer=-1;S.board=[];S.result=null;S.toAct=-1;
  S.seats=S.seats.filter(s=>!s.left);S.seats.forEach(s=>Object.assign(s,{chips:S.start,pending:0,bet:0,total:0,folded:false,allIn:false,out:false,waiting:false,tag:'',won:0,dealt:false,cards:[],enc:null}));await commit();});}

/* ===== menu ===== */
function openMenu(){
  const ov=document.createElement('div');ov.className='ov';
  const opts=S.seats.map((p,i)=>`<option value="${i}">${esc(p.name)}（${fmt(p.chips)}）</option>`).join('');
  const mi=mySeat();
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="メニュー"><h3>メニュー</h3>
    ${isHost?`<div class="grp"><label>チップを追加（次のハンドから反映）</label>
      <div class="r3"><select id="mp">${opts}</select><input id="ma" type="number" min="1" value="${S.start}"><button class="sbtn" id="madd">追加</button></div></div>
    <div class="grp"><label>ブラインド（次のハンドから）</label>
      <div class="r2"><input id="msb" type="number" min="1" value="${S.SB}" aria-label="SB"><input id="mbb" type="number" min="2" value="${S.BB}" aria-label="BB"><button class="sbtn" id="mbl">変更</button></div></div>
    <div class="grp"><label>CPUの速さ</label><div class="seg" role="group">${[['ゆっくり',1500],['ふつう',900],['はやい',350]].map(([t,v])=>`<button data-sp="${v}" aria-pressed="${speed===v}" style="flex:1">${t}</button>`).join('')}</div></div>`
    :`<p class="hint" style="margin:0">チップの追加やブラインドの変更はホスト（${esc(S.hostName)}）ができます。</p>`}
    <div class="note" id="mnote"></div>
    <div class="grp" style="grid-template-columns:1fr 1fr">
      ${isHost?'<button class="sbtn danger" id="mlobby">ゲームを終えてロビーへ</button><button class="sbtn danger" id="mclosetbl">テーブルを閉じる</button>'
        :(mi>=0?'<button class="sbtn danger" id="mleave">席を立つ（CPUが代打ち）</button>':'')}
      <button class="sbtn ghost" id="mhome">トップに戻る</button><button class="sbtn ghost" id="mclose">閉じる</button></div>
    ${isHost?'<p class="hint" style="margin:0">ホストがこのページを閉じるとゲームが止まります。開き直すと続きから再開します。</p>':''}</div>`;
  document.body.appendChild(ov);
  const note=t=>{ov.querySelector('#mnote').textContent=t;};
  const on=(id,f)=>{const e=ov.querySelector(id);if(e)e.onclick=f;};
  on('#madd',()=>{const i=+ov.querySelector('#mp').value,a=Math.max(1,parseInt(ov.querySelector('#ma').value)||0);
    hq(async()=>{const p=S.seats[i];if(S.status==='result'||S.status==='over'){p.chips+=a;p.out=false;}else p.pending=(p.pending||0)+a;await commit();});note(`${S.seats[i].name} に ${fmt(a)} 追加しました`);});
  on('#mbl',()=>{const s=Math.max(1,parseInt(ov.querySelector('#msb').value)||S.SB),b=Math.max(s,parseInt(ov.querySelector('#mbb').value)||S.BB);hostSettings({SB:s,BB:b});note(`ブラインドを ${fmt(s)}/${fmt(b)} にしました`);});
  ov.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;ov.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const arm=(id,f)=>{let armed=false;on(id,e=>{if(!armed){armed=true;e.target.textContent='もう一度押すと実行';return;}ov.remove();f();});};
  arm('#mlobby',hostToLobby);
  arm('#mclosetbl',()=>hq(async()=>{S.status='closed';await commit();await sleep(600);ls.set('aih_host','');setHash('');showHome('');}));
  arm('#mleave',()=>{sendJoin(true);});
  on('#mhome',()=>{ov.remove();setHash('');showHome('');});
  on('#mclose',()=>ov.remove());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

boot();
})();
</script>
</body>
</html>
